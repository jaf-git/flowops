<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      An inline mark rather than a file in public/.

      Without a link element the browser asks for /favicon.ico unprompted and gets a 404 on every
      page load — two console errors in a walk of the whole product, and one of them was this. A
      data URI answers it without adding a binary to the tree or a directory that holds one thing,
      and it cannot drift from the palette the way a hand-exported PNG does: the fill is
      --volt-500 (#dcfb4b) on --ink-900, which is the product's own accent on its own ink.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d0d0d'/%3E%3Cpath d='M10 8h12v4h-8v4h7v4h-7v8h-4z' fill='%23dcfb4b'/%3E%3C/svg%3E"
    />
    <title>FlowOps</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

# Test-wide configuration.
#
# A `.properties` file rather than `application.yaml`, and that is the whole reason it is this format.
# The main configuration is `src/main/resources/application.yaml`; a file of the same name on the test
# classpath does not merge with it, it *shadows* it — every datasource, Flyway and auth setting
# disappears and the whole suite fails at once, which is precisely what happened when this was first
# written as YAML. Two different filenames both load, and properties wins the keys it names.
#
# Here rather than in `@SpringBootTest(properties = …)` on the base classes because `properties` is
# part of Spring's context cache key: setting it on some bases and not others buys a second
# application context for the same application, which is the cost `ApplicationTest` and
# `RoundTripTest` were split apart to avoid. This file changes no key at all.

# PROCESS's reachability sweep runs once at startup under `fixedDelay`, so with scheduling on it reads
# the database while a class between tests truncates it. CI found that as `ERROR: deadlock detected` —
# 1155 tests, 0 failures, 1 error. It only became possible when the sweep started working: until then
# it threw on every pass and contended with nothing. Every assertion about the sweep calls
# `reconcile()` on the bean directly, which is the only deterministic way to test a clock-driven pass.
flowops.scheduling.enabled=false
